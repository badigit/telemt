name: Build tested failover binary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Upstream regression tests
        run: |
          timeout 1200 cargo test --locked --release transport::upstream:: -- --test-threads=2
      - name: Build deployable binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          timeout 900 cargo build --locked --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/telemt target/release/telemt-static
          test "$(stat -c%s target/release/telemt-static)" -gt 1000000
          file target/release/telemt-static | grep -E 'statically linked|static-pie linked'
          target/release/telemt-static --version
          cd target/release
          sha256sum telemt-static > telemt-static.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: telemt-linux-amd64-failover
          path: |
            target/release/telemt-static
            target/release/telemt-static.sha256
          retention-days: 90
